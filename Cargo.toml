[package]
name = "grubstation"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
cliclack = "0.5.4"
config = "0.15.23"
directories = "6.0.0"
dns-lookup = "3.0.1"
hostname = "0.4.2"
