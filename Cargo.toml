[package]
name = "grubstation"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
config = "0.15.23"
directories = "6.0.0"
hostname = "0.4.2"
mac_address = "1.1.8"
network-interface = "2.0.5"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
validator = { version = "0.20.0", features = ["derive"] }
mdns-sd = "0.20.0"
serde_json = "1.0.138"
tiny_http = "0.12.0"
fastrand = "2.3.0"
http = "1.4.2"
ureq = { version = "2.9.7", features = ["json"] }
ctrlc = "3.4.4"
log = "0.4.22"
env_logger = "0.11.5"

[dev-dependencies]
tempfile = "3.27.0"
